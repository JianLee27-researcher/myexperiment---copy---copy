{{ block title }}Waiting for Your Partner{{ endblock }}
{{ block content }}

<div class="container mt-5 text-center" style="max-width: 520px;">
  <div class="card border-0 shadow-sm p-4">
    <div class="mb-3">
      <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>
    <h4 class="fw-bold mb-2">Waiting for your partner…</h4>
    <p class="text-muted mb-0">
      Please wait while your partner finishes reading the briefing.
      The experiment will begin automatically once both participants are ready.
    </p>
  </div>
</div>

{{ endblock }}
